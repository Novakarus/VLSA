name: Publish tested 0.69.3 package
on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml, scripts/package.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package.py
      - name: Verify frozen archive
        run: |
          cd dist
          sha256sum --check ../releases/0.69.3/SHA256SUMS
      - name: Publish provisional release without overwriting an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create v0.69.3
          dist/Vietnam-Legal-Advisor-0.69.3.zip
          dist/Vietnam-Legal-Advisor-0.69.3.zip.sha256
          LICENSE.md
          --target "$GITHUB_SHA"
          --title "Vietnam Legal Advisor 0.69.3 — đánh giá AI tạm thời"
          --prerelease
          --notes-file releases/0.69.3/release-notes.md

