name: Báo lỗi
description: Báo lỗi bằng ví dụ đã che thông tin nhạy cảm
body:
  - type: markdown
    attributes:
      value: Không đăng dữ liệu khách hàng, mật khẩu hoặc thông tin cá nhân không cần thiết.
  - type: input
    id: version
    attributes:
      label: Phiên bản plugin và nền tảng
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Yêu cầu, bước thực hiện và kết quả thực tế
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi
